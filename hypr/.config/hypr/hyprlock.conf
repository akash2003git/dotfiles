# HYPRLOCK CONFIG - OFFICIAL CATPPUCCIN MOCHA PALETTE

background {
    monitor =
    path = /home/z-cell/.config/hypr/wallpapers/pixel_sakura_static.png
    
    blur_passes = 1
    blur_size = 3
    noise = 0.0117
    contrast = 0.9000
    brightness = 0.8000
    vibrancy = 0.2000
    
    # Mantle (#181825) Overlay
    color = rgba(24, 24, 37, 0.55)
}

general {
    hide_cursor = true
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(cba6f7)
    font_size = 110
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(11111b)
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgb(cdd6f4)
    font_size = 24
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgb(11111b)
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    
    outer_color = rgb(f2cdcd)
    inner_color = rgba(17, 17, 27, 0.85)
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    
    placeholder_text = <span foreground="##a6adc8"><i>󰌾 Input Password...</i></span>
    hide_input = false
    
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    
    position = 0, -80
    halign = center
    valign = center
}
